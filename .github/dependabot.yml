# ==============================================================================
# Dependabot 依赖自动化更新配置 (Dependabot Version Updates)
#
# 💡 机制说明：
# 1. 本配置负责常规月度依赖升级（Version Updates），采用语义化双轨模型聚合 PR；
# 2. 针对高危 CVE 漏洞的即时修复（Dependabot Security Updates）由 GitHub 平台原生实时守护，两者互补。
# 详见: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuring-dependabot-version-updates
# ==============================================================================

version: 2
updates:
  # 持续监控 GitHub Actions 工作流版本更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      # Actions 全版本智能聚合：将所有 Actions 的版本更新（含 Major/Minor/Patch）打包为单一 PR，杜绝通知轰炸与碎片化
      actions:
        patterns:
          - "*"

  # 前端依赖自动化巡检 (双轨聚合分组)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
